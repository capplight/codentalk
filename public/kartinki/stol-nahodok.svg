<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-labelledby="zagolovok">
<title id="zagolovok">Полка стола находок: на ней лежат четыре забытые вещи</title>
<!--
  Рисунок урока чтения «Читаем объявление о находках».

  ПЕРВАЯ РЕДАКЦИЯ ПОДПИСЫВАЛА ВЕЩИ НОМЕРАМИ ОТ 1 ДО 4 — и задание «Что лежит
  под номером 3?» решалось взглядом на картинку, не открывая объявления.
  Нашёл методист. Номера сняты: теперь они живут только в тексте, и задание
  снова требует чтения.

  Того же ряда была вторая беда: описание alt перечисляло, что под каким
  номером лежит, то есть печатало ответ раньше вопроса. Нашёл редактор. Теперь
  это ловит и npm run check:content — проверка сверяет описание картинки с
  ответом задания и умеет переводить ответ по словарным карточкам курса.

  Красок темы рисунок не наследует — см. пояснение в chey-ryukzak.svg.
-->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- полка -->
  <line x1="14" y1="150" x2="386" y2="150" stroke="#5b6b7f" stroke-width="3"/>
  <line x1="40" y1="150" x2="40" y2="172" stroke="#5b6b7f" stroke-width="3"/>
  <line x1="360" y1="150" x2="360" y2="172" stroke="#5b6b7f" stroke-width="3"/>

  <!-- шарф -->
  <path d="M38 58 q16 -14 32 0 v52 q-16 12 -32 0 z" fill="#3b82f6" fill-opacity=".16" stroke="#3b82f6" stroke-width="2.5"/>
  <path d="M46 110 v36 M62 110 v36" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- перчатка -->
  <path d="M138 88 v-26 a6 6 0 0 1 12 0 v22 M150 84 v-30 a6 6 0 0 1 12 0 v30 M162 84 v-24 a6 6 0 0 1 12 0 v28
           M174 88 v-14 a6 6 0 0 1 12 0 v30 a26 26 0 0 1 -26 26 h-10 a22 22 0 0 1 -22 -22 v-6 a6 6 0 0 1 12 0"
        fill="#8b5cf6" fill-opacity=".16" stroke="#8b5cf6" stroke-width="2.5"/>

  <!-- зонт -->
  <path d="M226 96 a38 38 0 0 1 76 0 z" fill="#3b82f6" fill-opacity=".16" stroke="#3b82f6" stroke-width="2.5"/>
  <path d="M264 96 v42 a12 12 0 0 0 24 0" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- цепочка -->
  <g stroke="#8b5cf6" stroke-width="2.5">
    <ellipse cx="330" cy="72" rx="9" ry="7"/>
    <ellipse cx="344" cy="86" rx="9" ry="7"/>
    <ellipse cx="330" cy="100" rx="9" ry="7"/>
    <ellipse cx="344" cy="114" rx="9" ry="7"/>
    <ellipse cx="330" cy="128" rx="9" ry="7"/>
  </g>
</g>
</svg>
