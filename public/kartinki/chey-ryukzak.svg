<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="340" height="200" role="img" aria-labelledby="zagolovok">
<title id="zagolovok">На парте лежит один рюкзак. По сторонам от него две бумажки с именами Daniyar и Aigul, у каждой знак вопроса. Внизу надпись Whose is it?</title>
<!--
  Рисунок урока «Чьё это».

  ПЕРВАЯ РЕДАКЦИЯ РИСОВАЛА ДВА РЮКЗАКА, КАЖДЫЙ С ИМЕНЕМ ХОЗЯИНА, и между ними
  «Whose is it?» — то есть спрашивала о том, что сама же и подписала. А
  вступление урока говорит «на парте лежит рюкзак, и никто не знает, чей он»:
  вещь одна и хозяин неизвестен. Ученик искал на картинке третью вещь и не
  находил. Нашёл методист.

  Теперь рисунок показывает ровно случай урока: вещь одна, имён два, и оба со
  знаком вопроса.

  Красок темы рисунок не наследует: внешний файл через <img> — отдельный
  документ, и переменные страницы до него не доходят. Поэтому линии и подписи
  взяты серо-синим, который читается и на светлой странице, и на тёмной, а
  заливки полупрозрачные: белая заливка светилась бы пятном на тёмной теме.
-->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- парта -->
  <line x1="86" y1="150" x2="254" y2="150" stroke="#5b6b7f" stroke-width="3"/>

  <!-- рюкзак посередине -->
  <rect x="126" y="52" width="88" height="98" rx="17" fill="#3b82f6" fill-opacity=".16" stroke="#3b82f6" stroke-width="2.5"/>
  <path d="M148 52 A22 22 0 0 1 192 52" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="145" y="100" width="50" height="31" rx="7" stroke="#3b82f6" stroke-width="2"/>
  <line x1="170" y1="52" x2="170" y2="100" stroke="#3b82f6" stroke-width="2"/>

  <!-- бумажки с именами по сторонам -->
  <rect x="10" y="76" width="86" height="34" rx="8" stroke="#5b6b7f" stroke-width="2"/>
  <rect x="244" y="76" width="86" height="34" rx="8" stroke="#5b6b7f" stroke-width="2"/>
</g>
<g font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" text-anchor="middle" fill="#5b6b7f">
  <text x="53" y="99" font-size="16">Daniyar</text>
  <text x="287" y="99" font-size="16">Aigul</text>
  <text x="53" y="134" font-size="24">?</text>
  <text x="287" y="134" font-size="24">?</text>
  <text x="170" y="184" font-size="17">Whose is it?</text>
</g>
</svg>
